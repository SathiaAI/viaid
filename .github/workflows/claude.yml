name: Claude Code

# SAT-1014 prep: enables `@claude` mentions in issues/PRs, authenticated as the
# Claude GitHub App -- a credential path independent of both Composio and this
# session's blocked git-credential-proxy. This is the foundational enablement
# piece only; it does NOT wire up adversarial-review or any SAT-1014-specific
# automation yet -- that's pending Paul's call on blocking semantics, cost-per-PR
# handling, and risk-tier auto-classification (SAT-1014).
#
# Both setup prerequisites are done as of 2026-08-14:
#   1. The Claude GitHub App is installed on SathiaAI -- confirmed by Paul via
#      github.com/settings/applications ("Claude has been installed on 1
#      account you have access to: SathiaAI").
#   2. CLAUDE_CODE_OAUTH_TOKEN (subscription token via `claude setup-token`)
#      is added as a repo secret -- confirmed via the GitHub API (name
#      present, created 2026-08-14T02:05:46Z; only the name/existence was
#      checked here, the token value itself was never seen or handled).
#
# Matches the example workflow from https://code.claude.com/docs/en/github-actions
# as closely as possible rather than introducing untested deviations. STILL
# UNTESTED end to end: this sandbox can't trigger or observe a GitHub Actions
# run, so the first real signal will be an actual `@claude` comment on a PR
# or issue.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  claude:
    if: contains(github.event.comment.body, '@claude')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
          persist-credentials: false
      # SHA sourced via automated web fetch of the v1 release page (2026-08-13),
      # not independently cross-verified against the GitHub API -- api.github.com
      # returned 403 from this sandbox on every attempt. Spot-check against
      # github.com/anthropics/claude-code-action/releases/tag/v1 before merging,
      # per this repo's established pin-to-digest convention (see ci.yml).
      - uses: anthropics/claude-code-action@5ef2e550a465a721f4f45e4a7d3c340c873e1dcc # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # If switching to API-key billing instead of the subscription token,
          # delete the line above and use instead:
          # anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
