name: Adversarial Review Gate

# SAT-1117: consume the published adversarial-review action instead of a vendored
# copy + hand-rolled claude-code-action panel.
#
# Why this change: viaid vendored a badly stale snapshot of the adversarial-review
# skill under .claude/skills/adversarial-review/ and drove it with anthropics/
# claude-code-action under a managed-settings allow-list that denied `panel.py run`.
# The panel therefore never completed, aggregate.py wrote no verdict.json, and the
# fail-closed enforcement failed the `review` job on every PR (#15/#16/#17).
#
# The published action (SathiaAI/adversarial-review, GitHub Action shipped in that
# repo's #19) runs the panel directly via OpenRouter -- no claude-code-action, no
# managed-settings wall -- records gates through gate.py, and computes + enforces the
# machine verdict via aggregate.py. viaid already holds OPENROUTER_API_KEY, so the
# panel runs. Pinned to the exact release tag @v0.2.0 (commit 3438615) so the gate
# cannot silently drift again.
#
# Kept: the deterministic, path-based classify job (SAT-1014, 2026-08-13), now fed to
# the action's `risk` input. NORMAL PRs still skip the panel (ci.yml + CodeRabbit
# already cover them). The fork-PR fast-fail guard is kept (fork PRs get no repo
# secrets, so the panel cannot run -- fail honestly, a maintainer reviews manually).
#
# DRAFT / adoption posture (follows the product's own examples/adversarial-review.yml):
# fail-on: fail while adopting -- a real FAIL fails the job; a BLOCKED verdict
# (e.g. gate coverage still being wired up) is tolerated as a warning. Fast-follows
# tracked in SAT-1117:
#   - tighten CRITICAL to fail-on: blocked once gate coverage is confirmed;
#   - expand `gates` to secrets/deps/sast (mutation is deferred per SAT-1008) with the
#     adversarial-review sessions on the supported consumer pattern -- today ci.yml
#     still enforces secrets/deps/sast independently;
#   - delete the now-unused vendored .claude/skills/adversarial-review/ and the
#     .github/claude-code/ enforcement pin (this PR only repoints the workflow).

on:
  pull_request:

permissions:
  contents: read

jobs:
  classify:
    runs-on: ubuntu-latest
    outputs:
      tier: ${{ steps.classify.outputs.tier }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: classify
        run: |
          # Path-based risk-tier classification (SAT-1014 decision, 2026-08-13).
          CRITICAL_PATTERNS='^(src/agentid\.mjs|bin/viaid\.mjs)$'
          NORMAL_PATTERNS='^(test/.*|.*\.md)$'

          CHANGED=$(git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}")
          echo "Changed files:"
          echo "$CHANGED"

          TIER="NORMAL"
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            if echo "$f" | grep -qE "$CRITICAL_PATTERNS"; then
              TIER="CRITICAL"
              break
            elif echo "$f" | grep -qE "$NORMAL_PATTERNS"; then
              continue
            else
              TIER="SENSITIVE"
            fi
          done <<< "$CHANGED"

          echo "Classified tier: $TIER"
          echo "tier=$TIER" >> "$GITHUB_OUTPUT"

  review:
    needs: classify
    if: needs.classify.outputs.tier != 'NORMAL'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      # Fork PRs do not receive repo secrets (GitHub's own design), so
      # OPENROUTER_API_KEY would be empty and the panel could not run. Fail fast
      # with an honest reason instead of a confusing BLOCKED -- a maintainer reviews
      # fork PRs manually before merging.
      - name: Stop early and clearly if this is a fork PR
        if: github.event.pull_request.head.repo.fork
        run: |
          echo "This PR is from a fork ($HEAD_REPO -> $BASE_REPO)."
          echo "GitHub does not pass repository secrets (including OPENROUTER_API_KEY)"
          echo "to pull_request runs for fork-originated PRs -- deliberate GitHub behavior,"
          echo "not a bug in this workflow. Automated adversarial-review cannot run;"
          echo "a maintainer must review this PR manually before merging."
          exit 1
        env:
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.event.pull_request.base.repo.full_name }}

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0   # the panel reviews a real git range
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - uses: SathiaAI/adversarial-review@v0.2.0
        with:
          # Deterministic tier from the classify job above (NORMAL is filtered out
          # by the job-level if:). The action resolves gates/policy from the tier.
          risk: ${{ needs.classify.outputs.tier }}
          product: viaid
          # gates: newline-separated name=command; each runs through gate.py and is
          # recorded for the verdict. Starter set while adopting; ci.yml still runs
          # secrets/deps/sast as independent required checks.
          gates: |
            build=node --test
            fuzz=npm ci && npm run fuzz:verify-badge
          # Adoption posture: fail the job only on a real FAIL; tolerate BLOCKED as a
          # warning (SAT-1117 fast-follow tightens CRITICAL to 'blocked').
          fail-on: fail
          openrouter-api-key: ${{ secrets.OPENROUTER_API_KEY }}
