name: ViaID Evidence — ai-defects (dogfood)

# SAT-1104 — Quiet dogfood of the CURRENT adversarial-review "ai-defects" deeper
# verifier on ViaID's own PRs.
#
# EVIDENCE ONLY. Records exactly one schema-valid verdict (badge + job summary)
# for every non-NORMAL run and NEVER blocks a merge. Separate from the required
# review gate (adversarial-review-gate.yml) — do NOT mark this job "required".
#
# Decisions (Paul, 2026-09-21): evidence-only (not required-green); reuse the
# CURRENT published action, SHA-pinned (same rev as SAT-1117 / #24); risk-classified
# (deeper verify only on non-NORMAL PRs).
#
# Fail-closed HONESTY (ai-defects TRD §8.6 #3): every non-NORMAL run records one
# verdict; a missing / incomplete / undeterminable result is BLOCKED, never PASS
# and never silently skipped. This covers a fork PR (secrets withheld), a failed
# classify job, or an action that returns no verdict. "Fail-closed" = the recorded
# evidence status is honest; it does NOT mean the job blocks the PR. NORMAL PRs are
# out of deep-verify scope by design and intentionally record no verdict.
#
# Brand note (TRD §8.6 #1): the vendor-brand ban targets the *ai-defects deeper
# verifier engine*, which the published SathiaAI/adversarial-review action
# abstracts — it never appears here. gitleaks / osv-scanner / semgrep below are the
# repo's standard public gate scanners (identical to ci.yml), not the banned engine.
#
# MUST-NOT (TRD §8.6): no engine brand in name/copy/log; no verifier binary
# committed; evidence != ship verdict (never replaces panel/aggregate, posts no
# product claim); log carries the verdict + non-secret metadata only.

on:
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  classify:
    runs-on: ubuntu-latest
    outputs:
      tier: ${{ steps.classify.outputs.tier }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: classify
        run: |
          # Same deterministic path-based tiering as the required gate (SAT-1014).
          CRITICAL_PATTERNS='^(src/agentid\.mjs|bin/viaid\.mjs)$'
          NORMAL_PATTERNS='^(test/.*|.*\.md)$'
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual dispatch -> SENSITIVE (no PR diff context)."
            echo "tier=SENSITIVE" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CHANGED=$(git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}")
          echo "Changed files:"; echo "$CHANGED"
          TIER="NORMAL"
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            if echo "$f" | grep -qE "$CRITICAL_PATTERNS"; then TIER="CRITICAL"; break
            elif echo "$f" | grep -qE "$NORMAL_PATTERNS"; then continue
            else TIER="SENSITIVE"; fi
          done <<< "$CHANGED"
          echo "Classified tier: $TIER"
          echo "tier=$TIER" >> "$GITHUB_OUTPUT"

  evidence:
    needs: classify
    # Always runs so every non-NORMAL PR records exactly one verdict, even when the
    # panel cannot run (fork, or a failed classify). NORMAL exits without a verdict.
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
      AR_MAX_TOKENS: '16000'
      AR_REASONING_EFFORT: medium
    steps:
      - name: Decide mode (fail-closed)
        id: mode
        run: |
          set -uo pipefail
          TIER='${{ needs.classify.outputs.tier }}'
          CLASSIFY_RESULT='${{ needs.classify.result }}'
          IS_FORK='${{ github.event.pull_request.head.repo.fork }}'
          if [ "$CLASSIFY_RESULT" != "success" ] || [ -z "$TIER" ]; then
            echo "mode=blocked reason=classify-failed"
            echo "mode=blocked" >> "$GITHUB_OUTPUT"; echo "reason=classify-failed" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "$TIER" = "NORMAL" ]; then
            echo "mode=skip reason=normal-tier"
            echo "mode=skip" >> "$GITHUB_OUTPUT"; echo "reason=normal-tier" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "$IS_FORK" = "true" ]; then
            echo "mode=blocked reason=fork-no-secrets"
            echo "mode=blocked" >> "$GITHUB_OUTPUT"; echo "reason=fork-no-secrets" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "mode=verify reason=non-normal"
          echo "mode=verify" >> "$GITHUB_OUTPUT"; echo "reason=non-normal" >> "$GITHUB_OUTPUT"

      - if: steps.mode.outputs.mode == 'verify'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - if: steps.mode.outputs.mode == 'verify'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'

      - if: steps.mode.outputs.mode == 'verify'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install pinned gate scanners
        if: steps.mode.outputs.mode == 'verify'
        run: |
          set -euo pipefail
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz | tar -xz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          curl -sSfL https://github.com/google/osv-scanner/releases/download/v2.0.2/osv-scanner_linux_amd64 -o /tmp/osv-scanner
          sudo install -m 0755 /tmp/osv-scanner /usr/local/bin/osv-scanner
          python -m pip install --quiet semgrep==1.171.0

      - name: Install deps (no lifecycle scripts — PR code cannot exfil creds via npm hooks)
        if: steps.mode.outputs.mode == 'verify'
        run: npm ci --ignore-scripts

      # Dogfood the CURRENT published adversarial-review action (same SHA as #24).
      # EVIDENCE MODE: continue-on-error so a FAIL/BLOCKED verdict never fails the
      # job. No fail-on — this job is not a gate.
      # Gate fixes vs first draft: build uses --ignore-scripts (a same-repo PR must
      # not run prepack/prepare hooks while GITLEAKS_LICENSE is in env); deps uses
      # the osv-scanner v2 `scan` subcommand (root-level --lockfile is not a v2 flag).
      - uses: SathiaAI/adversarial-review@c42dfc3a2b924b539cb8d3c5b7d5fee5d5f0c164 # main post-#66: reliable panel (matches #24 pin)
        id: ar
        if: steps.mode.outputs.mode == 'verify'
        continue-on-error: true
        with:
          risk: ${{ needs.classify.outputs.tier }}
          dev-providers: anthropic
          product: viaid
          gates: |
            build=npm pack --dry-run --ignore-scripts
            unit=node --test
            secrets=gitleaks detect --no-banner --redact --source . --exit-code 1
            deps=osv-scanner scan --lockfile=package-lock.json
            sast=semgrep scan --config p/default --error
          openrouter-api-key: ${{ secrets.OPENROUTER_API_KEY }}

      # Record exactly one schema-valid verdict as badge + log. Fail-closed:
      #   verify + recognised verdict -> that verdict
      #   verify + no verdict / blocked / fork / classify-failed -> BLOCKED
      #   NORMAL -> no verdict (out of deep-verify scope, by design)
      - name: Record honest verdict (evidence — badge + log)
        if: always()
        run: |
          set -uo pipefail
          MODE='${{ steps.mode.outputs.mode }}'
          REASON='${{ steps.mode.outputs.reason }}'
          if [ "$MODE" = "skip" ]; then
            echo "NORMAL tier — deep verify not applicable; no verdict recorded (by design)."
            {
              echo "### ViaID evidence — ai-defects (SAT-1104)"
              echo ""
              echo "NORMAL tier: deep verify not applicable. No verdict recorded (by design)."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "$MODE" = "verify" ]; then
            OUTCOME='${{ steps.ar.outcome }}'
            VERDICT='${{ steps.ar.outputs.verdict }}'
            case "$VERDICT" in
              PASS|FAIL|BLOCKED) RAN=true ;;
              *) VERDICT=BLOCKED; RAN=false; REASON=no-verdict ;;
            esac
          else
            OUTCOME='skipped'; VERDICT=BLOCKED; RAN=false
          fi
          TIER='${{ needs.classify.outputs.tier }}'; [ -z "$TIER" ] && TIER=UNKNOWN
          BASE='${{ github.event.pull_request.base.sha }}'
          HEAD='${{ github.event.pull_request.head.sha }}'; [ -z "$HEAD" ] && HEAD='${{ github.sha }}'
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          printf '%s\n' \
            '{' \
            '  "schema_version": "1.0",' \
            '  "ticket": "SAT-1104",' \
            '  "kind": "viaid-evidence-ai-defects",' \
            "  \"tier\": \"$TIER\"," \
            "  \"verdict\": \"$VERDICT\"," \
            "  \"verifier_ran\": $RAN," \
            "  \"reason\": \"$REASON\"," \
            "  \"action_outcome\": \"$OUTCOME\"," \
            "  \"base_sha\": \"$BASE\"," \
            "  \"head_sha\": \"$HEAD\"," \
            "  \"run_url\": \"$RUN_URL\"," \
            "  \"recorded_at\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"" \
            '}' > ai-defects-verdict.json
          jq -e '.verdict|test("^(PASS|FAIL|BLOCKED)$")' ai-defects-verdict.json >/dev/null
          echo "ai-defects evidence verdict: $VERDICT (ran=$RAN, reason=$REASON, outcome=$OUTCOME)"
          {
            echo "### ViaID evidence — ai-defects (SAT-1104, evidence-only)"
            echo ""
            echo "| field | value |"
            echo "|---|---|"
            echo "| tier | $TIER |"
            echo "| verdict | \`$VERDICT\` |"
            echo "| verifier ran | $RAN |"
            echo "| reason | $REASON |"
            echo ""
            echo "_Evidence only — this check does not block the merge._"
            echo ""
            echo '```json'
            cat ai-defects-verdict.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
