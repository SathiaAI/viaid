title = "viaid gitleaks config"

# Extend (not replace) gitleaks' default ruleset -- this file only adds a scoped
# allowlist, it must not silently narrow real secret detection anywhere else.
[extend]
useDefault = true

# SAT-1009 fuzz seed fixtures (fuzz/corpus/verify-badge/*.json) trip the default
# generic-api-key rule on `next_key_commitment` / `new_next_key_commitment` values.
# Those are SHA-256 hashes of a not-yet-revealed public key in this project's
# KERI-style pre-rotation scheme (see rotateKey() in src/agentid.mjs) -- meant to
# be disclosed publicly ahead of time, not secrets. The `*_pub` / `*_sig` /
# `voucher_attestation` fields in the same files are literal placeholder strings
# (base64 of "garbage-not-a-real-...") used only to make each fuzz seed a
# structurally well-formed badge; never real key material.
#
# Scoped narrowly (CodeRabbit review, PR #15): a rule-level allowlist on
# generic-api-key with condition = "AND", so a finding is ignored ONLY when it is
# BOTH (a) in that fixtures directory AND (b) on a *_commitment line carrying a
# 64-hex value. Every other default rule (private-key, aws-access-token, ...)
# stays fully active in that directory, and generic-api-key itself still fires
# there on any non-commitment line.
[[rules]]
id = "generic-api-key"

  [[rules.allowlists]]
  condition = "AND"
  description = "viaid fuzz-corpus KERI pre-rotation commitments (public by design, not secrets)"
  paths = ['''^fuzz/corpus/verify-badge/.*\.json$''']
  regexTarget = "line"
  regexes = ['''"(next_key_commitment|new_next_key_commitment)"\s*:\s*"[0-9a-f]{64}"''']
